version: 1
# AWS Amplify Hosting, Web Compute: the app's platform must be WEB_COMPUTE (see backend/deploy/AMPLIFY.md).
frontend:
  phases:
    build:
      commands:
        - bash backend/deploy/amplify/build.sh
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - backend/node_modules/**/*
