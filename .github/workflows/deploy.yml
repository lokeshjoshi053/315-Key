name: Test and deploy API

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['backend/**']
  workflow_dispatch:

permissions:
  id-token: write # OIDC: GitHub proves its identity to AWS, no stored AWS keys
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: plots315-api
  ECS_CLUSTER: plots315
  ECS_SERVICE: plots315-api
  CONTAINER_NAME: api

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:e2e # booking race, webhook idempotency, ledger, authz on real Postgres

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/plots315-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Fill in AWS account id
        run: sed "s/<ACCOUNT_ID>/${{ vars.AWS_ACCOUNT_ID }}/g" deploy/ecs-task-definition.json > task-def.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend/task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true # fails the run if the new tasks don't pass /health
